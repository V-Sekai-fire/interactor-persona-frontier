# The whole gate is the flake: the package builds against the pinned Lean toolchain and runs the witness,
# the NixOS test starts the service on FoundationDB, plans a goal, refuses another, and reads the
# pages back from fdbcli, and the Ubuntu container tests do the same through system-manager with SQLite and with
# FoundationDB. Nothing else is installed here.
name: flake

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # the Ubuntu container tests build with the uid-range sandbox feature, which needs this
          extra-conf: |
            extra-experimental-features = auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true
      - run: nix flake check -L
