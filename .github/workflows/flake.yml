# The whole gate is the flake: the package builds against the pinned Lean toolchain and runs the witness,
# and the NixOS test starts the service on FoundationDB, plans a goal, refuses another, and reads the
# pages back from fdbcli. Nothing else is installed here.
name: flake

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check -L
