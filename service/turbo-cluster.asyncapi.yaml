asyncapi: 3.1.0
info:
  title: Turbo cluster
  version: 0.1.0
  description: >
    Distributed solving of one constraint problem. A coordinator node hands out subproblems (the search is split into 2^power of them); worker nodes each run the
    solver guest ELF under libriscv and report. Nodes are Erlang nodes joined with a shared cookie, so a worker can be on another machine. The coordinator trusts no
    worker: a subproblem's answer depends only on the problem, its index and the bound it is assigned with, so an answer is accepted when f + 1 nodes give the same
    one. A node whose answer differs from the accepted one gets a strike; with strikes it is on probation (its answers are checked but do not count), a run of
    accepted answers takes a strike off, and at the strike limit it is banned. The same queue recovers a node that dies. Both sides are state machines and no
    decision reads a clock. Between a worker node and its libriscv host the frames are length-prefixed (four bytes, big endian) on standard input and output.
  license:
    name: MIT
servers:
  cluster:
    host: coordinator.node:4369
    protocol: erlang-distribution
    description: Erlang distribution (epmd on 4369 and the node's own port); the cookie authenticates the nodes. The coordinator registers the name turbo_coordinator.
channels:
  coordinator:
    address: turbo_coordinator
    messages:
      hello:
        $ref: '#/components/messages/hello'
      fromWorker:
        $ref: '#/components/messages/fromWorker'
  worker:
    address: worker process
    messages:
      problem:
        $ref: '#/components/messages/problem'
      toHost:
        $ref: '#/components/messages/toHost'
  host:
    address: standard input and output of turbo_host
    messages:
      hostFrame:
        $ref: '#/components/messages/hostFrame'
operations:
  announce:
    action: send
    channel:
      $ref: '#/channels/coordinator'
    messages:
      - $ref: '#/channels/coordinator/messages/hello'
  report:
    action: send
    channel:
      $ref: '#/channels/coordinator'
    messages:
      - $ref: '#/channels/coordinator/messages/fromWorker'
  instruct:
    action: receive
    channel:
      $ref: '#/channels/worker'
    messages:
      - $ref: '#/channels/worker/messages/problem'
      - $ref: '#/channels/worker/messages/toHost'
  frames:
    action: send
    channel:
      $ref: '#/channels/host'
    messages:
      - $ref: '#/channels/host/messages/hostFrame'
components:
  messages:
    hello:
      summary: A worker joins.
      payload:
        type: object
        required: [pid, kind, hlc]
        properties:
          hlc: {type: integer, format: int64, description: "the sender's hybrid logical clock (EntityPacket/Hlc.lean): 48 bits of milliseconds since the epoch, 16 of counter; a receiver merges it into its own unless it is more than a minute ahead of the receiver's clock"}
          pid: {type: string, description: the worker process, used as the node's identity}
          kind: {type: string, enum: [cpu, gpu]}
    fromWorker:
      summary: A frame from the node's host, relayed unchanged.
      payload:
        type: object
        required: [pid, frame, hlc]
        properties:
          hlc: {type: integer, format: int64, description: "the sender's hybrid logical clock (EntityPacket/Hlc.lean): 48 bits of milliseconds since the epoch, 16 of counter; a receiver merges it into its own unless it is more than a minute ahead of the receiver's clock"}
          pid: {type: string}
          frame:
            type: string
            description: >
              "U bound": a better objective bound than the last one reported (informative; the coordinator does not act on it).
              "A skip bound solutions nodes": the guest finished or was cancelled on a subproblem and waits for the next. The four numbers are that subproblem's
              answer and nothing of the ones before it: the first subproblem its dive did not make unreachable, its best bound, the solutions it found and the nodes
              it searched. Two honest nodes give the same four numbers for the same subproblem and assigned bound.
              "R nodes fails solutions bound depth_max exhaustive" then one line "lower upper" per variable: the final report, with the best store.
    problem:
      summary: The problem, as the text the guest reads (a header of ten integers, the store, the bytecodes, the strategies).
      payload:
        type: object
        required: [text, hlc]
        properties:
          hlc: {type: integer, format: int64, description: "the sender's hybrid logical clock (EntityPacket/Hlc.lean): 48 bits of milliseconds since the epoch, 16 of counter; a receiver merges it into its own unless it is more than a minute ahead of the receiver's clock"}
          text: {type: string}
    toHost:
      summary: A frame for the host.
      payload:
        type: object
        required: [frame, hlc]
        properties:
          hlc: {type: integer, format: int64, description: "the sender's hybrid logical clock (EntityPacket/Hlc.lean): 48 bits of milliseconds since the epoch, 16 of counter; a receiver merges it into its own unless it is more than a minute ahead of the receiver's clock"}
          frame:
            type: string
            description: >
              "S index bound": solve subproblem index with this bound. The bound is fixed when the subproblem is first handed out and comes from accepted
              answers only, so every replica of the subproblem gets the same one.
              "D": no more subproblems.
              "C": cancel the subproblem in hand, it has been accepted.
              "X": stop.
    hostFrame:
      summary: The first frame of a host is "H" (hello); the worker answers with "P" and the problem text.
      payload:
        type: string
